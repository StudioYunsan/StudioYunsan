<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Let&#x27;s Create. Contact studio.yunsan@gmail.com or scan the QR to visit yunsan.studio">
<title>Let&#x27;s Create. Contact studio.yunsan@gmail.com or scan the QR to visit yunsan.studio</title>
<style>@font-face{font-family:'PlayfairM';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Inter';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Mono';src:url(data:font/woff2;base64,) format('woff2');}
.borg{font-family:'Borg';} .pf{font-family:'PlayfairM';font-weight:500;} .pfi{font-family:'PlayfairI';font-style:italic;}
.in{font-family:'Inter';font-weight:300;} .mono{font-family:'Mono';text-transform:uppercase;}
@keyframes rise{from{opacity:0;translate:0 28px}to{opacity:1;translate:0 0}}
.r{opacity:0;animation:rise 1.4s cubic-bezier(.16,1,.3,1) forwards;transform-box:fill-box;}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}.d5{animation-delay:.95s}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ping{0%{transform:scale(1);opacity:.75}80%,100%{transform:scale(2.6);opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}

@keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(236px);opacity:0}}
.scan{animation:scan 3.2s cubic-bezier(.4,0,.2,1) infinite;}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
.nudge{animation:nudge 1.8s ease-in-out infinite;}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
<defs><pattern id="g24" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity="0.022" stroke-width="1"/></pattern><filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#d4af37" stop-opacity="0"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<rect width="1200" height="600" rx="14" fill="#0a0a0e"/><rect width="1200" height="600" rx="14" filter="url(#noise)" opacity=".03"/>

<!-- left: CTA -->
<g class="r">
<text class="pf" x="40" y="150" font-size="60" fill="#f4f4f5">Let&#8217;s Create.</text>
<text class="in" x="40" y="210" font-size="20" fill="#8a8a93"><tspan x="40">A vision is only as good as its execution.</tspan><tspan x="40" dy="32">Drop your details, and let&#8217;s cut something incredible.</tspan></text>
</g>
<g class="r d2" transform="translate(40 300)">
  <rect width="620" height="230" rx="3" fill="#050507" fill-opacity=".5" stroke="#1a1a24"/>
  <text class="mono" x="36" y="56" font-size="11" letter-spacing="3" fill="#8a8a93">CHANNEL OPEN</text>
  <path d="M36 72H584" stroke="#1a1a24"/>
  <text class="mono" x="36" y="112" font-size="18" letter-spacing="2" fill="#f4f4f5" style="text-transform:none">studio.yunsan@gmail.com</text><rect x="336" y="96" width="9" height="20" fill="#d4af37" style="animation:caret 1s steps(1) infinite"/>
  <path d="M36 128H584" stroke="#d4af37" stroke-opacity=".5"/>
  <text class="mono" x="36" y="186" font-size="12" letter-spacing="3.2" fill="#f4f4f5">INITIATE PROJECT</text>
  <g class="nudge"><path d="M224 181H250M242 173l8 8-8 8" stroke="#d4af37" stroke-width="1.6" fill="none"/></g>
  <text class="mono" x="584" y="186" text-anchor="end" font-size="10" letter-spacing="2" fill="#8a8a93">RESPONSE &lt; 24H</text>
</g>

<!-- right: HUD quick-connect -->
<g class="r d3" transform="translate(700 60)">
  <rect width="460" height="480" rx="3" fill="#050507" fill-opacity=".6" stroke="#1a1a24"/>
  <rect width="460" height="480" fill="url(#g24)"/>
  <circle cx="34" cy="38" r="4" fill="#d4af37"/><circle cx="34" cy="38" r="4" fill="#d4af37" class="ping"/>
  <text class="mono" x="48" y="42" font-size="10.5" letter-spacing="2.5" fill="#f4f4f5" opacity=".9">HUD // QUICK CONNECT</text>
  <text class="mono" x="430" y="42" text-anchor="end" font-size="9.5" letter-spacing="2" fill="#8a8a93">SYS.0XYS-PASS</text>
  <path d="M24 62H436" stroke="#fff" stroke-opacity=".05"/>
</g>
<g class="r d3">
  <rect x="798" y="182" width="264" height="264" rx="3" fill="#0a0a0e" stroke="#fff" stroke-opacity=".1"/>
  <path d="M802 196V186H812" fill="none" stroke="#d4af37" stroke-width="2" opacity="1"/><path d="M1058 196V186H1048" fill="none" stroke="#d4af37" stroke-width="2" opacity="1"/><path d="M802 432V442H812" fill="none" stroke="#d4af37" stroke-width="2" opacity="1"/><path d="M1058 432V442H1048" fill="none" stroke="#d4af37" stroke-width="2" opacity="1"/>
  <image x="812" y="196" width="236" height="236" href="data:image/png;base64," xlink:href="data:image/png;base64," style="image-rendering:pixelated"/>
  <g class="scan"><g transform="translate(0 196)"><rect x="798" y="0" width="264" height="2" fill="url(#beam)"/><rect x="798" y="-2" width="264" height="6" fill="url(#beam)" filter="url(#glow)" opacity=".7"/></g></g>
  <text class="mono" x="930" y="478" text-anchor="middle" font-size="10" letter-spacing="2.2" fill="#8a8a93">SCAN TO TRANSFER YUNSAN STUDIO TO MOBILE</text>
  <path d="M724 494H1136" stroke="#fff" stroke-opacity=".05"/>
  <text class="mono" x="724" y="522" font-size="10.5" letter-spacing="1.6" fill="#8a8a93">TARGET DOMAIN</text>
  <text class="mono" x="1136" y="522" text-anchor="end" font-size="12" letter-spacing="3" fill="#f4f4f5" style="text-transform:none">yunsan.studio</text>
</g>
</svg>