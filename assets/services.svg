<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Capabilities: Faceless Documentaries, High-Retention Gaming, Bespoke 2D Animation, 3D On-Call Roster">
