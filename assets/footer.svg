<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="YUNSAN. — Cut. Grade. Animate. Repeat.">
<title>YUNSAN. — Cut. Grade. Animate. Repeat.</title>
<style>@font-face{font-family:'Borg';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Mono';src:url(data:font/woff2;base64,) format('woff2');}
.borg{font-family:'Borg';} .pf{font-family:'PlayfairM';font-weight:500;} .pfi{font-family:'PlayfairI';font-style:italic;}
.in{font-family:'Inter';font-weight:300;} .mono{font-family:'Mono';text-transform:uppercase;}
@keyframes rise{from{opacity:0;translate:0 28px}to{opacity:1;translate:0 0}}
.r{opacity:0;animation:rise 1.4s cubic-bezier(.16,1,.3,1) forwards;transform-box:fill-box;}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}.d5{animation-delay:.95s}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ping{0%{transform:scale(1);opacity:.75}80%,100%{transform:scale(2.6);opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}

@keyframes march{from{transform:translateX(0)}to{transform:translateX(-600px)}}
.march{animation:march 30s linear infinite;}</style>
<defs><clipPath id="c"><rect width="1200" height="150" rx="14"/></clipPath><filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs>
<g clip-path="url(#c)"><rect width="1200" height="150" fill="#050507"/>
<path d="M0 44H1200" stroke="#1a1a24"/><path d="M0 2H1200" stroke="#1a1a24" opacity="0"/>
<g class="march"><text class="mono" x="0" y="28" font-size="11" letter-spacing="4" fill="#8a8a93" opacity=".7">CUT. GRADE. ANIMATE. REPEAT.  //  CUT. GRADE. ANIMATE. REPEAT.  //  CUT. GRADE. ANIMATE. REPEAT.  //  CUT. GRADE. ANIMATE. REPEAT.  //  CUT. GRADE. ANIMATE. REPEAT.  //  CUT. GRADE. ANIMATE. REPEAT.  //  CUT. GRADE. ANIMATE. REPEAT.  //  CUT. GRADE. ANIMATE. REPEAT.</text></g>
<text class="borg" x="40" y="112" font-size="38" letter-spacing="6" fill="#f4f4f5">YUNSAN.</text>
<text class="mono" x="1160" y="104" text-anchor="end" font-size="11" letter-spacing="3" fill="#8a8a93">EST. 2026 // YUNSAN.STUDIO</text>
<rect x="1146" y="114" width="14" height="1.2" fill="#d4af37"/>
<rect width="1200" height="150" filter="url(#noise)" opacity=".05"/></g>
<rect x=".5" y=".5" width="1199" height="149" rx="14" fill="none" stroke="#1a1a24"/>
</svg>