<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="About: We built our rhythm cutting high-retention Let&#x27;s Plays for major creators, mastering pacing and dead-air to keep eyes locked on the screen. Today, we architect long-form documentaries and bespoke 2D animation, scaling to full-agency firepower through our exclusive on-call roster of 3D artists.">
<title>About: We built our rhythm cutting high-retention Let&#x27;s Plays for major creators, mastering pacing and dead-air to keep eyes locked on the screen. Today, we architect long-form documentaries and bespoke 2D animation, scaling to full-agency firepower through our exclusive on-call roster of 3D artists.</title>
<style>@font-face{font-family:'Inter';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Mono';src:url(data:font/woff2;base64,) format('woff2');}
.borg{font-family:'Borg';} .pf{font-family:'PlayfairM';font-weight:500;} .pfi{font-family:'PlayfairI';font-style:italic;}
.in{font-family:'Inter';font-weight:300;} .mono{font-family:'Mono';text-transform:uppercase;}
@keyframes rise{from{opacity:0;translate:0 28px}to{opacity:1;translate:0 0}}
.r{opacity:0;animation:rise 1.4s cubic-bezier(.16,1,.3,1) forwards;transform-box:fill-box;}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}.d5{animation-delay:.95s}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ping{0%{transform:scale(1);opacity:.75}80%,100%{transform:scale(2.6);opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.float{animation:float 6s ease-in-out infinite;}
.pulse{animation:pulse 3s cubic-bezier(.4,0,.6,1) infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite;}
</style>
<defs><pattern id="g40" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.055" stroke-width="1"/></pattern><filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><clipPath id="vp"><rect x="700" y="70" width="420" height="420" rx="3"/></clipPath></defs>
<rect width="1200" height="560" rx="14" fill="#050507"/><rect width="1200" height="560" rx="14" filter="url(#noise)" opacity=".05"/>
<text class="mono r" x="40" y="118" font-size="11" letter-spacing="3" fill="#d4af37" opacity=".8">EDITORS / ANIMATORS / STORYTELLERS</text>
<rect class="r" x="40" y="136" width="32" height="1.2" fill="#d4af37" opacity=".7"/>
<text class="in r d1" x="40" y="200" font-size="21" fill="#8a8a93"><tspan x="40" dy="0">We built our rhythm cutting high-retention</tspan><tspan x="40" dy="36">Let&#x27;s Plays for major creators, mastering</tspan><tspan x="40" dy="36">pacing and dead-air to keep eyes locked on</tspan><tspan x="40" dy="36">the screen. Today, we architect long-form</tspan><tspan x="40" dy="36">documentaries and bespoke 2D animation,</tspan><tspan x="40" dy="36">scaling to full-agency firepower through our</tspan><tspan x="40" dy="36">exclusive on-call roster of 3D artists.</tspan></text>
<g class="r d2"><g class="float">
  <g clip-path="url(#vp)"><rect x="700" y="70" width="420" height="420" fill="#0a0a0e" fill-opacity=".7"/><rect x="700" y="70" width="420" height="420" fill="url(#g40)"/></g>
  <rect x="700.5" y="70.5" width="419" height="419" rx="3" fill="none" stroke="#fff" stroke-opacity=".1"/>
  <rect x="716" y="86" width="388" height="388" fill="none" stroke="#d4af37" stroke-opacity=".38"/>
  <text class="mono" x="732" y="114" font-size="10" letter-spacing="2" fill="#fff" fill-opacity=".45">VIEWPORT // ACTIVE</text>
  <text class="mono" x="1088" y="114" text-anchor="end" font-size="10" letter-spacing="2" fill="#fff" fill-opacity=".45">TEMPLATE_SPACE_01</text>
  <text class="mono" x="732" y="458" font-size="10" letter-spacing="2" fill="#fff" fill-opacity=".45">X: 0.00 / Y: 0.00 / Z: 0.00</text>
  <text class="mono" x="1088" y="458" text-anchor="end" font-size="10" letter-spacing="2" fill="#fff" fill-opacity=".45">AWAITING ASSET</text>
  <g class="pulse"><circle cx="910.0" cy="280.0" r="32" fill="none" stroke="#fff" stroke-opacity=".35"/><circle cx="910.0" cy="280.0" r="3" fill="#d4af37"/></g>
  <circle class="spin" cx="910.0" cy="280.0" r="72" fill="none" stroke="#d4af37" stroke-opacity=".5" stroke-dasharray="1 7"/>
  <path d="M910.0 130V190.0M910.0 370.0V430M760 280.0H820.0M1000.0 280.0H1060" stroke="#fff" stroke-opacity=".08"/>
</g></g>
</svg>