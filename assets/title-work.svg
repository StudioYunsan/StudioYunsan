<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Selected Works">
<title>Selected Works</title>
<style>@font-face{font-family:'PlayfairM';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PlayfairI';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Mono';src:url(data:font/woff2;base64,) format('woff2');}
.borg{font-family:'Borg';} .pf{font-family:'PlayfairM';font-weight:500;} .pfi{font-family:'PlayfairI';font-style:italic;}
.in{font-family:'Inter';font-weight:300;} .mono{font-family:'Mono';text-transform:uppercase;}
@keyframes rise{from{opacity:0;translate:0 28px}to{opacity:1;translate:0 0}}
.r{opacity:0;animation:rise 1.4s cubic-bezier(.16,1,.3,1) forwards;transform-box:fill-box;}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}.d5{animation-delay:.95s}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ping{0%{transform:scale(1);opacity:.75}80%,100%{transform:scale(2.6);opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}

@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rule{transform-origin:600px 0;transform:scaleX(0);animation:grow 1.4s .5s cubic-bezier(.16,1,.3,1) forwards;}
@keyframes sweep{0%{transform:translateX(-200px)}100%{transform:translateX(1400px)}}
.sweep{animation:sweep 6s 1.5s linear infinite;}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#d4af37" stop-opacity="0"/><stop offset=".5" stop-color="#d4af37" stop-opacity=".9"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="170" rx="14" fill="#050507"/>
<text class="mono r" x="600" y="40" text-anchor="middle" font-size="11" letter-spacing="4" fill="#d4af37" opacity=".8">01  //  PORTFOLIO</text>
<text class="r d1" x="600" y="110" text-anchor="middle" font-size="56" fill="#f4f4f5"><tspan class="pf">Selected </tspan><tspan class="pfi">Works</tspan></text>
<rect class="rule" x="584" y="138" width="32" height="1.2" fill="#d4af37" opacity=".7"/>
<line x1="40" y1="169.5" x2="1160" y2="169.5" stroke="#1a1a24"/>
<rect class="sweep" x="0" y="168.5" width="200" height="2" fill="url(#g)"/>
</svg>