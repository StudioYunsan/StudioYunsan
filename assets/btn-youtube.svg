<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="280" height="64" viewBox="0 0 280 64" role="img" aria-label="YouTube"><title>YouTube</title><style>@font-face{font-family:'InterB';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Mono';src:url(data:font/woff2;base64,) format('woff2');}
.borg{font-family:'Borg'} .ar{font-family:'Arch';text-transform:uppercase} .se{font-family:'Serif'} .si{font-family:'SerifI'}
.in{font-family:'Inter';font-weight:300} .ib{font-family:'InterB';font-weight:500} .mo{font-family:'Mono';text-transform:uppercase}
@keyframes rise{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}
.r{opacity:0;animation:rise 1.3s cubic-bezier(.16,1,.3,1) forwards}
.d1{animation-delay:.12s}.d2{animation-delay:.28s}.d3{animation-delay:.44s}.d4{animation-delay:.6s}.d5{animation-delay:.76s}.d6{animation-delay:.92s}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}} .blink{animation:blink 1.2s steps(1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
@keyframes glow{0%{translate:0 0;scale:1}50%{translate:40px -20px;scale:1.12}100%{translate:0 0;scale:1}}
.glow{transform-box:fill-box;transform-origin:center;animation:glow 14s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -12px;rotate:-1.5deg}}
.bob{transform-box:fill-box;transform-origin:50% 90%;animation:bob 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}

@keyframes sheen{0%{transform:translateX(-140px) skewX(-20deg)}55%,100%{transform:translateX(420px) skewX(-20deg)}} .sheen{animation:sheen 5s cubic-bezier(.4,0,.2,1) infinite}
@keyframes spr{0%,70%,100%{translate:0 0;rotate:0deg}80%{translate:3px -3px;rotate:-12deg}} .spr{transform-box:fill-box;transform-origin:center;animation:spr 3.2s cubic-bezier(.34,1.56,.64,1) infinite}</style><defs><clipPath id="c"><rect width="280" height="64" rx="32"/></clipPath><linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<g clip-path="url(#c)"><rect width="280" height="64" fill="#14110f"/><rect width="280" height="64" fill="#ff4e45" fill-opacity=".08"/><rect class="sheen" width="90" height="64" fill="url(#s)"/></g>
<rect x=".75" y=".75" width="278.5" height="62.5" rx="31.25" fill="none" stroke="#ff4e45" stroke-opacity="0.5" stroke-width="1.5"/>
<circle cx="32" cy="32" r="20" fill="#ff4e45" fill-opacity="0.16"/>
<g transform="translate(21 21) scale(.92)" fill="none" stroke="#ff4e45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></g>
