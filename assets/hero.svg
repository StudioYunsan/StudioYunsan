<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="YUNSAN STUDIO — Visual Awe. A boutique post-production studio.">
<title>YUNSAN STUDIO — Visual Awe. A boutique post-production studio.</title>
<style>@font-face{font-family:'Borg';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PlayfairM';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PlayfairI';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Mono';src:url(data:font/woff2;base64,) format('woff2');}
.borg{font-family:'Borg';} .pf{font-family:'PlayfairM';font-weight:500;} .pfi{font-family:'PlayfairI';font-style:italic;}
.in{font-family:'Inter';font-weight:300;} .mono{font-family:'Mono';text-transform:uppercase;}
@keyframes rise{from{opacity:0;translate:0 28px}to{opacity:1;translate:0 0}}
.r{opacity:0;animation:rise 1.4s cubic-bezier(.16,1,.3,1) forwards;transform-box:fill-box;}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}.d5{animation-delay:.95s}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ping{0%{transform:scale(1);opacity:.75}80%,100%{transform:scale(2.6);opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}

@keyframes drift{0%{transform:scale(1.05) translate(0,0)}100%{transform:scale(1.18) translate(-30px,-14px)}}
.ink{transform-origin:600px 300px;animation:drift 20s ease-in-out infinite alternate;}
@keyframes scan{0%{transform:translateY(0);opacity:0}12%{opacity:.9}88%{opacity:.9}100%{transform:translateY(540px);opacity:0}}
.scan{animation:scan 5.5s cubic-bezier(.4,0,.2,1) infinite;}
.rec{animation:blink 1.2s steps(1) infinite;}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rule{transform-origin:600px 0;transform:scaleX(0);animation:grow 1.6s 1.1s cubic-bezier(.16,1,.3,1) forwards;}
@keyframes tick10{from{transform:translateY(0)}to{transform:translateY(-160px)}}@keyframes tick6{from{transform:translateY(0)}to{transform:translateY(-96px)}}@keyframes tick2{from{transform:translateY(0)}to{transform:translateY(-32px)}}</style>

<defs>
  <clipPath id="frame"><rect x="0" y="0" width="1200" height="620" rx="14"/></clipPath>
  <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.006" numOctaves="4" seed="7" result="t">
      <animate attributeName="baseFrequency" dur="28s" values="0.0035 0.006;0.0055 0.004;0.0035 0.006" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.14  0 0 0 0 0.13  0 0 0 0 0.17  0 0 0 3.2 -1.45"/>
  </filter>
  <filter id="inkGold" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="3" seed="21">
      <animate attributeName="baseFrequency" dur="34s" values="0.006 0.009;0.004 0.012;0.006 0.009" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix type="matrix" values="0 0 0 0 0.83  0 0 0 0 0.69  0 0 0 0 0.22  0 0 0 4 -2.55"/>
  </filter>
  <filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#050507" stop-opacity=".05"/><stop offset=".55" stop-color="#050507" stop-opacity=".55"/><stop offset="1" stop-color="#050507" stop-opacity="1"/>
  </linearGradient>
  <radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
  <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#d4af37" stop-opacity="0"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="620" fill="#050507"/>
  <g class="ink"><rect x="-80" y="-80" width="1360" height="780" filter="url(#ink)"/><rect x="-80" y="-80" width="1360" height="780" filter="url(#inkGold)" opacity=".22"/></g>
  <rect width="1200" height="620" fill="url(#fade)"/>
  <rect width="1200" height="620" fill="url(#vig)"/>
  <rect width="1200" height="620" filter="url(#noise)" opacity=".07"/>

  <!-- nav -->
  <text class="borg r" x="44" y="66" font-size="34" letter-spacing="5" fill="#f4f4f5">YUNSAN.</text>
  <text class="mono r d1" x="1156" y="60" text-anchor="end" font-size="11" letter-spacing="3.2" fill="#f4f4f5" xml:space="preserve">WORK    ABOUT    CONTACT</text>

  <!-- headline -->
  <g class="r d2"><text x="600" y="330" text-anchor="middle" font-size="138" letter-spacing="-3" fill="#f4f4f5"><tspan class="pf">Visual </tspan><tspan class="pfi" fill="#8a8a93">Awe.</tspan></text></g>
  <rect class="rule" x="584" y="372" width="32" height="1.2" fill="#d4af37" opacity=".7"/>
  <text class="mono r d4" x="600" y="414" text-anchor="middle" font-size="12.5" letter-spacing="4.2" fill="#8a8a93">A BOUTIQUE POST-PRODUCTION STUDIO</text>

  <!-- viewfinder HUD -->
  <path d="M28 118V96H50" fill="none" stroke="#f4f4f5" stroke-width="1.4" opacity="0.28"/><path d="M1172 118V96H1150" fill="none" stroke="#f4f4f5" stroke-width="1.4" opacity="0.28"/><path d="M28 558V580H50" fill="none" stroke="#f4f4f5" stroke-width="1.4" opacity="0.28"/><path d="M1172 558V580H1150" fill="none" stroke="#f4f4f5" stroke-width="1.4" opacity="0.28"/>
  <g transform="translate(600 300)" opacity=".22"><path d="M-10 0H10M0 -10V10" stroke="#f4f4f5" stroke-width="1"/></g>
  <g class="r d5">
    <circle class="rec" cx="50" cy="582" r="4.5" fill="#e5484d"/>
    <text class="mono" x="62" y="586" font-size="12" letter-spacing="2" fill="#f4f4f5" opacity=".85">REC</text>
    <text class="mono" x="112" y="586" font-size="12" letter-spacing="2" fill="#8a8a93">4K  24FPS  YS-CAM_A</text>
    <text class="mono" font-size="12" letter-spacing="1" fill="#f4f4f5" opacity=".85" x="1029.8" y="586">TC</text><text class="mono" font-size="12" letter-spacing="1" fill="#8a8a93" x="1063.8" y="586">0</text><text class="mono" font-size="12" letter-spacing="1" fill="#8a8a93" x="1072.0" y="586">0</text><text class="mono" font-size="12" letter-spacing="1" fill="#8a8a93" x="1080.2" y="586">:</text><text class="mono" font-size="12" letter-spacing="1" fill="#8a8a93" x="1088.4" y="586">0</text><text class="mono" font-size="12" letter-spacing="1" fill="#8a8a93" x="1096.6" y="586">0</text><text class="mono" font-size="12" letter-spacing="1" fill="#8a8a93" x="1104.8" y="586">:</text><text class="mono" font-size="12" letter-spacing="1" fill="#8a8a93" x="1129.4" y="586">:</text><svg x="1113.0" y="574" width="11" height="16" overflow="hidden"><g style="animation:tick6 60s steps(6) 0s infinite"><text class="mono" font-size="12" fill="#8a8a93" x="1" y="12"><tspan x="1" dy="0">0</tspan><tspan x="1" dy="16">1</tspan><tspan x="1" dy="16">2</tspan><tspan x="1" dy="16">3</tspan><tspan x="1" dy="16">4</tspan><tspan x="1" dy="16">5</tspan><tspan x="1" dy="16">6</tspan></text></g></svg><svg x="1121.2" y="574" width="11" height="16" overflow="hidden"><g style="animation:tick10 10s steps(10) 0s infinite"><text class="mono" font-size="12" fill="#8a8a93" x="1" y="12"><tspan x="1" dy="0">0</tspan><tspan x="1" dy="16">1</tspan><tspan x="1" dy="16">2</tspan><tspan x="1" dy="16">3</tspan><tspan x="1" dy="16">4</tspan><tspan x="1" dy="16">5</tspan><tspan x="1" dy="16">6</tspan><tspan x="1" dy="16">7</tspan><tspan x="1" dy="16">8</tspan><tspan x="1" dy="16">9</tspan><tspan x="1" dy="16">0</tspan></text></g></svg><svg x="1137.6" y="574" width="11" height="16" overflow="hidden"><g style="animation:tick2 1s steps(2) 0s infinite"><text class="mono" font-size="12" fill="#8a8a93" x="1" y="12"><tspan x="1" dy="0">0</tspan><tspan x="1" dy="16">1</tspan><tspan x="1" dy="16">2</tspan></text></g></svg><svg x="1145.8" y="574" width="11" height="16" overflow="hidden"><g style="animation:tick10 0.4167s steps(10) 0s infinite"><text class="mono" font-size="12" fill="#8a8a93" x="1" y="12"><tspan x="1" dy="0">0</tspan><tspan x="1" dy="16">1</tspan><tspan x="1" dy="16">2</tspan><tspan x="1" dy="16">3</tspan><tspan x="1" dy="16">4</tspan><tspan x="1" dy="16">5</tspan><tspan x="1" dy="16">6</tspan><tspan x="1" dy="16">7</tspan><tspan x="1" dy="16">8</tspan><tspan x="1" dy="16">9</tspan><tspan x="1" dy="16">0</tspan></text></g></svg>
  </g>
  <g class="scan" transform="translate(0 0)"><g transform="translate(0 70)"><rect x="40" y="0" width="1120" height="1.5" fill="url(#beam)" opacity=".55"/><rect x="40" y="-2" width="1120" height="5" fill="url(#beam)" opacity=".25" filter="url(#glow)"/></g></g>
  <rect x=".5" y=".5" width="1199" height="619" rx="14" fill="none" stroke="#1a1a24"/>
</g>
</svg>